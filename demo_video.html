<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo วิดีโอการใช้งาน — Media Relocation Tracker & AI Gate</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #f8fafc;
            font-family: 'Prompt', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-bar {
            width: 100%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #00a8e8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-badges {
            display: flex;
            gap: 8px;
        }
        .badge {
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(0, 168, 232, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(0, 168, 232, 0.3);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #020617;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        canvas#demoCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-bar {
            width: 100%;
            max-width: 1280px;
            background: #0f172a;
            border-radius: 12px;
            padding: 12px 18px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid #1e293b;
        }
        .btn-ctrl {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-ctrl:hover { background: #0369a1; transform: translateY(-1px); }
        .btn-secondary {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }
        .btn-secondary:hover { background: #334155; color: #fff; }
        .timeline-slider {
            flex: 1;
            accent-color: #00a8e8;
            cursor: pointer;
        }
        .time-display {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            min-width: 80px;
            font-variant-numeric: tabular-nums;
        }

        .scene-pills {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 1280px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .scene-pill {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #1e293b;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .scene-pill.active, .scene-pill:hover {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <script>

                stepTitle: 'ตรวจสอบประวัติย้อนหลังเชิงลึก (Timeline Audit Trail Verification)',

                subTitle: 'กดปุ่มเปลี่ยนสถานะป้ายเป็น \'ติดตั้งสำเร็จ (Completed)\' ข้อมูลถูกบันทึกขึ้น Google Sheets (แท็บ Media_Data และ History_Log) แบบ Real-time ทันที',

            },
            {

                id: 'SCENE_EMAIL',
                stepNum: 'ขั้นตอนที่ 6 / 6 (L4/L5)',
                stepTitle: 'ระบบกระจายรายงานอีเมลผู้บริหาร & ตั้งเวลาอัตโนมัติ (Executive Digest & Weekly Auto)',
                badge: '6. ส่งสรุปอีเมล & Weekly Auto',
                badgeColor: '#9333ea',
                subTitle: 'หน้าต่าง Gmail-Style Compose จัดการรายชื่อผู้รับแบบ Tag/Chip ส่งแยกรายบุคคล (Individual Dispatch) พร้อมตารางเปรียบเทียบรายปี และตั้งเวลาอัตโนมัติทุกเช้าวันจันทร์ 08:00 น.',

            },
            {
                start: 54, end: 60,
                id: 'SCENE_6',
                stepNum: 'บทสรุปผู้บริหาร',
                stepTitle: 'สรุปคุณค่าและผลกระทบทางธุรกิจ (Executive Summary & Business Impact)',
                badge: '7. สรุปผลสัมฤทธิ์ต่อองค์กร',
                badgeColor: '#00a8e8',
                subTitle: 'ระบบลดเวลาทำงานจาก 15 นาทีเหลือเพียง 5 วินาที ขจัดข้อผิดพลาดเป็น 0% ควบคุมงบประมาณ ฿7.0M (ผลกระทบ ฿9.6M) พร้อมใช้ระดับองค์กร',
                actionNote: 'KPIs อัปเดตทันที: เวลาลดลง 98% | ข้อมูลถูกต้อง 100% | ติดตามงบ ฿7.0M โปร่งใส | ครบเกณฑ์ AI Gate Level 1 - 5'
            }
        ];

        // Virtual Cursor State
        let cursor = { x: 960, y: 540, clicking: false, ripple: 0 };

        function getCurrentScene(t) {
            return scenes.find(s => t >= s.start && t < s.end) || scenes[scenes.length - 1];
        }

        // Draw Helper Functions
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function drawCursor(x, y, isClicking) {
            ctx.save();
            if (cursor.ripple > 0) {
                ctx.beginPath();
                ctx.arc(x, y, (1 - cursor.ripple) * 35, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 168, 232, ${cursor.ripple})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                cursor.ripple = Math.max(0, cursor.ripple - 0.05);
            }

            // Mouse pointer arrow
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, 22);
            ctx.lineTo(6, 17);
            ctx.lineTo(12, 27);
            ctx.lineTo(16, 25);
            ctx.lineTo(10, 15);
            ctx.lineTo(18, 15);
            ctx.closePath();
            ctx.fillStyle = isClicking ? '#00a8e8' : '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        function drawSubtitleBar(scene, progressInScene) {
            const barH = 150;
            const barY = 1080 - barH;

            // Gradient dark glassmorphic banner
            const grad = ctx.createLinearGradient(0, barY, 0, 1080);
            grad.addColorStop(0, 'rgba(15, 23, 42, 0.94)');
            grad.addColorStop(1, 'rgba(2, 6, 23, 0.98)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, barY, 1920, barH);

            // Glowing top divider line
            const lineGrad = ctx.createLinearGradient(0, 0, 1920, 0);
            lineGrad.addColorStop(0, '#00a8e8');
            lineGrad.addColorStop(0.5, '#38bdf8');
            lineGrad.addColorStop(1, '#10b981');
            ctx.fillStyle = lineGrad;
            ctx.fillRect(0, barY, 1920, 3);

            // Step Badge & Title
            ctx.fillStyle = scene.badgeColor;
            roundRect(ctx, 60, barY + 16, 170, 30, 6);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px "Prompt", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(scene.stepNum, 145, barY + 36);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Prompt", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(scene.stepTitle, 250, barY + 38);

            // Action Callout Pill (Right side)
            ctx.fillStyle = 'rgba(2, 132, 199, 0.2)';
            roundRect(ctx, 1380, barY + 16, 480, 32, 6);
            ctx.fill();
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 14px "Prompt", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('⚡ ' + scene.actionNote.split('➔')[0].trim(), 1620, barY + 37);

            // Subtitle Description (Thai explanation)
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '400 18px "Prompt", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(scene.subTitle, 60, barY + 76);

            // Micro-action timeline bullet
            ctx.fillStyle = '#94a3b8';
            ctx.font = '400 15px "Prompt", sans-serif';
            ctx.fillText('▶ การดำเนินการ: ' + scene.actionNote, 60, barY + 110);

            // Plan B Logo / Branding at bottom right
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 14px "Prompt", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('Plan B Media  |  Media Relocation Tracker (Production Demo)', 1860, barY + 110);
        }

        // Top App Header
        function drawAppHeader(activeTab) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 1920, 70);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 68, 1920, 2);

            // Logo & Title
            ctx.fillStyle = '#00a8e8';
            ctx.font = 'bold 22px "Prompt", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('⚡ Plan B Media — Media Relocation Tracker & AI Gate', 50, 42);

            ctx.fillStyle = '#059669';
            roundRect(ctx, 620, 22, 110, 26, 13);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px "Prompt", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('● LIVE PROD', 675, 39);

            // Tabs
            const tabs = [
                { id: 1, name: '📊 ภาพรวมและสถิติประวัติงาน' },
                { id: 2, name: '⏳ คลังคำขอที่ยังดำเนินการไม่เสร็จ (24)' },
                { id: 3, name: '🤖 AI Integrator (Level 4) & Google Drive' }
            ];
            let tx = 800;
            tabs.forEach(t => {
                const isActive = t.id === activeTab;
                if (isActive) {
                    ctx.fillStyle = '#0284c7';
                    roundRect(ctx, tx, 16, 260, 38, 8);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    roundRect(ctx, tx, 16, 260, 38, 8);
                    ctx.fill();
                    ctx.fillStyle = '#94a3b8';
                }
                ctx.font = (isActive ? 'bold ' : '400 ') + '13px "Prompt", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(t.name, tx + 130, 40);
                tx += 275;
            });

            // Admin Badge
            ctx.fillStyle = '#3b82f6';
            roundRect(ctx, 1680, 18, 180, 34, 8);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px "Prompt", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('👤 Admin: staticmedia', 1770, 40);
        }

        // Render Frame by Frame
        function render() {
            const scene = getCurrentScene(currentTime);
            const progress = (currentTime - scene.start) / (scene.end - scene.start);

            // Clear Background
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, 1920, 1080);

            if (scene.id === 'SCENE_1') {
                // SCENE 1: Input text in Tab 3 AI Integrator
                drawAppHeader(3);

                // Workflow Canvas preview top
                const imgAiCanvas = document.getElementById('imgAiCanvas');
                if (imgAiCanvas.complete) {
                    ctx.drawImage(imgAiCanvas, 50, 90, 1820, 260);
                }

                // AI Input Box
                ctx.fillStyle = '#0f172a';
                roundRect(ctx, 50, 370, 1820, 540, 12);
                ctx.fill();
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Title of Section
                ctx.fillStyle = '#00a8e8';
                ctx.font = 'bold 20px "Prompt", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('📥 นำเข้าข้อความแจ้งย้ายป้ายดิบ (Unstructured Text Intake) — รองรับ LINE / อีเมล / เอกสาร', 80, 410);

                // Sample Prompt Buttons
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                roundRect(ctx, 80, 430, 260, 36, 6);
                ctx.fill();
                ctx.fillStyle = '#38bdf8';
                ctx.font = '13px "Prompt", sans-serif';
                ctx.fillText('ตัวอย่าง 1: ย้ายเสร็จแล้ว (มีวันเริ่ม-ปิด)', 95, 453);

                ctx.fillStyle = 'rgba(2, 132, 199, 0.3)';
                roundRect(ctx, 360, 430, 260, 36, 6);
                ctx.fill();
                ctx.strokeStyle = '#38bdf8';
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.fillText('✓ ตัวอย่าง 2: แผนล่วงหน้า (รอย้าย)', 375, 453);

                // Textarea Box
                ctx.fillStyle = '#020617';
                roundRect(ctx, 80, 480, 1760, 220, 8);
                ctx.fill();

                    { num: '98%', title: 'ประหยัดเวลาทำงาน (Time Reduction)', desc: 'ลดเวลาเปิดเคสและคีย์ข้อมูลจาก 15-20 นาที เหลือเพียง 5 วินาทีต่อเคส', color: '#00a8e8' },
                    { num: '100%', title: 'ความถูกต้องแม่นยำ (Zero Error)', desc: 'ควบคุมด้วย Code Guardrail 4 ชั้น ขจัด AI Hallucination และข้อมูลตกหล่น', color: '#10b981' },
                    { num: '฿7.0M', title: 'ควบคุมต้นทุนทางตรง (Direct Cost Control)', desc: 'บริหารจัดการ 75 ป้าย (งบตรง ฿7.0M, ผลกระทบ ฿9.6M) ติดตามป้ายค้าง 24 รายการ', color: '#f59e0b' },
                    { num: 'Weekly', title: 'ส่งสรุปอัตโนมัติระดับผู้บริหาร (L4/L5)', desc: 'Executive Email Digest ทุกเช้าวันจันทร์ 08:00 น. พร้อมระบบจัดการผู้รับ No-Code', color: '#8b5cf6' }
                ];

                let sy = 180;
                summaryKpis.forEach(k => {
                    ctx.fillStyle = '#1e293b';
                    roundRect(ctx, 1000, sy, 830, 140, 8);
                    ctx.fill();

                    ctx.fillStyle = k.color;
                    ctx.font = 'bold 36px "Prompt", sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(k.num, 1030, sy + 60);

                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'bold 18px "Prompt", sans-serif';
                    ctx.fillText(k.title, 1200, sy + 45);

                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '14px "Prompt", sans-serif';
                    ctx.fillText(k.desc, 1200, sy + 75);

                    sy += 160;
                });
            }

            // Draw Bottom Subtitle Bar
            drawSubtitleBar(scene, progress);

            // Update UI Slider & Time
            document.getElementById('timeSlider').value = currentTime;
            const mins = String(Math.floor(currentTime / 60)).padStart(2, '0');
            const secs = String(Math.floor(currentTime % 60)).padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${mins}:${secs} / 01:00`;

            // Update scene pills
            document.querySelectorAll('.scene-pill').forEach((pill, idx) => {
                if (idx === scenes.indexOf(scene)) {
                    pill.classList.add('active');
                } else {
                    pill.classList.remove('active');
                }
            });
        }

        // Animation Loop
        function loop(timestamp) {
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (isPlaying) {
                currentTime += dt;
                if (currentTime >= TOTAL_DURATION) {
                    if (isAutoRecording) {
                        return; // Auto recorder handles stopping
                    }
                    currentTime = 0; // loop
                }
            }
            render();
            requestAnimationFrame(loop);
        }

        let isAutoRecording = false;

        async function init() {
            // Preload images
            const imgs = Array.from(document.querySelectorAll('img'));
            await Promise.all(imgs.map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
            }));

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('autorecord') === '1') {
                isAutoRecording = true;
                const stream = canvas.captureStream(30);
                const mime = MediaRecorder.isTypeSupported('video/mp4; codecs=avc1') ? 'video/mp4; codecs=avc1' : (MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm');
                const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
                const chunks = [];
                recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: mime });
                    await fetch('/save_video', { method: 'POST', body: blob });
                    document.title = 'AUTORECORD_COMPLETE';
                };

                currentTime = 0;
                isPlaying = true;
                recorder.start(100);

                const checkInterval = setInterval(() => {
                    if (currentTime >= TOTAL_DURATION) {
                        clearInterval(checkInterval);
                        recorder.stop();
                    }
                }, 200);
            }

            requestAnimationFrame(loop);
        }
        window.onload = init;

        // Control handlers
        document.getElementById('btnPlayPause').onclick = () => {
            isPlaying = !isPlaying;
            document.getElementById('playIcon').innerText = isPlaying ? '⏸️' : '▶️';
            document.getElementById('playText').innerText = isPlaying ? 'หยุดชั่วคราว' : 'เล่นต่อ';
        };

        document.getElementById('btnRestart').onclick = () => {
            currentTime = 0;
            isPlaying = true;
            document.getElementById('playIcon').innerText = '⏸️';
            document.getElementById('playText').innerText = 'หยุดชั่วคราว';
        };

        document.getElementById('timeSlider').oninput = (e) => {
            currentTime = parseFloat(e.target.value);
            render();
        };

        function seekTo(sec) {
            currentTime = sec;
            isPlaying = true;
            document.getElementById('playIcon').innerText = '⏸️';
            document.getElementById('playText').innerText = 'หยุดชั่วคราว';
            render();
        }

        // Recorder function to record canvas to MP4/WebM
        document.getElementById('btnDownload').onclick = async () => {
            const btn = document.getElementById('btnDownload');
            btn.innerText = '⏳ กำลังบันทึกวิดีโอ (0%)...';
            btn.disabled = true;

            const stream = canvas.captureStream(30);
            const mime = MediaRecorder.isTypeSupported('video/mp4; codecs=avc1') ? 'video/mp4; codecs=avc1' : (MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm');
            const ext = mime.includes('mp4') ? 'mp4' : 'webm';
            const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `demo_media_relocation_app.${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                btn.innerText = '✓ บันทึกสำเร็จ!';
                setTimeout(() => {
                    btn.innerText = '⬇️ บันทึกคลิป MP4';
                    btn.disabled = false;
                }, 3000);
            };

            // Record entire 50s at accelerated render or real-time
            currentTime = 0;
            isPlaying = true;
            recorder.start(100);

            const checkInterval = setInterval(() => {
                const pct = Math.floor((currentTime / TOTAL_DURATION) * 100);
                btn.innerText = `⏳ กำลังบันทึกวิดีโอ (${pct}%)...`;
                if (currentTime >= TOTAL_DURATION - 0.2) {
                    clearInterval(checkInterval);
                    recorder.stop();
                }
            }, 500);
        };
    </script>
</body>
</html>
